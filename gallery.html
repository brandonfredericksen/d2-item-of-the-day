<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D2 IOTD — Item Gallery</title>
<style>
  :root{
    --bg:#0b0b0d; --bg-elev:#161619; --bg-elev-2:#1d1d21;
    --border:#2a2a30; --text:#e8e8ec; --text-dim:#a2a2ab; --text-faint:#6f6f78;
    --accent:#c7b377;
    --t-s:#e0463f; --t-a:#e08a3f; --t-b:#e0c93f; --t-c:#8fce6b; --t-d:#5db0d8; --t-f:#6b6b74;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:Montserrat,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  header{
    padding:12px 18px; border-bottom:1px solid var(--border);
    display:flex; align-items:baseline; gap:12px; flex:none;
  }
  header .title{font-weight:800; letter-spacing:.22em; text-transform:uppercase; font-size:.8rem}
  header .title b{color:#e03a33; font-weight:800}
  header .count{color:var(--text-faint); font-size:.72rem; letter-spacing:.12em; text-transform:uppercase}
  header .hint{color:var(--text-faint); font-size:.72rem}
  .list-search{
    position:sticky; top:0; z-index:2;
    margin:-8px -8px 8px; padding:8px;
    background:var(--bg); border-bottom:1px solid var(--border);
  }
  .list-search input{
    width:100%; padding:7px 12px; border-radius:999px;
    background:var(--bg-elev-2); border:1px solid var(--border);
    color:var(--text); font-family:inherit; font-size:.82rem;
  }
  .list-search input::placeholder{color:var(--text-faint)}
  .list-search input:focus{outline:none; border-color:var(--accent)}

  .wrap{display:flex; flex:1; min-height:0}
  .list{
    width:360px; flex:none; overflow-y:auto; border-right:1px solid var(--border);
    padding:8px;
  }
  .row{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; border-radius:8px; cursor:pointer;
    border:1px solid transparent;
  }
  .row:hover, .row.active{background:var(--bg-elev); border-color:var(--border)}
  .row .idx{color:var(--text-faint); font-size:.7rem; width:22px; text-align:right; flex:none}
  .row .name{flex:1; font-size:.9rem}
  .row .name small{display:block; color:var(--text-faint); font-size:.7rem; margin-top:1px}
  .chip{
    font-size:.6rem; font-weight:800; letter-spacing:.04em;
    padding:2px 6px; border-radius:999px; background:var(--bg-elev-2);
    border:1px solid var(--border); flex:none;
  }
  .v-S{color:var(--t-s)} .v-A{color:var(--t-a)} .v-B{color:var(--t-b)}
  .v-C{color:var(--t-c)} .v-D{color:var(--t-d)} .v-F{color:var(--t-f)}
  .legacy-dot{color:var(--accent); font-size:.7rem; flex:none}

  .preview{flex:1; min-width:0; position:relative; background:#000}
  .preview iframe{width:100%; height:100%; border:0; background:var(--bg)}
  .preview .empty{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:var(--text-faint); font-size:.85rem; pointer-events:none;
  }

  @media (max-width:720px){
    .wrap{flex-direction:column}
    .list{width:100%; height:45%; border-right:0; border-bottom:1px solid var(--border)}
    .preview{height:55%}
  }
</style>
</head>
<body>
<header>
  <span class="title"><b>DIABLO 2</b> Item Gallery</span>
  <span class="count" id="count"></span>
  <span class="hint">hover or tap a name to preview it</span>
</header>
<div class="wrap">
  <div class="list" id="list">
    <div class="list-search"><input id="search" type="search" placeholder="Search by name…" autocomplete="off" spellcheck="false"></div>
  </div>
  <div class="preview">
    <div class="empty" id="empty">Hover an item to see it as the home page renders it.</div>
    <iframe id="frame" title="preview"></iframe>
  </div>
</div>

<script src="items.js"></script>
<script>
  // Resolve a possibly-localized field to English text.
  function txt(v){
    if (v == null) return "";
    if (typeof v === "string") return v;
    return v.en || v[Object.keys(v)[0]] || "";
  }

  var list = document.getElementById("list");
  var frame = document.getElementById("frame");
  var empty = document.getElementById("empty");
  document.getElementById("count").textContent = ITEMS.length + " items";

  var activeRow = null;
  function preview(slug, row){
    frame.src = "index.html?item=" + encodeURIComponent(slug);
    empty.style.display = "none";
    if (activeRow) activeRow.classList.remove("active");
    activeRow = row; row.classList.add("active");
  }

  ITEMS.forEach(function(item, i){
    var row = document.createElement("div");
    row.className = "row";

    var idx = document.createElement("span");
    idx.className = "idx"; idx.textContent = (i + 1);

    var name = document.createElement("span");
    name.className = "name";
    var alias = txt(item.alias);
    name.innerHTML = escapeHtml(txt(item.title) || txt(item.name)) + (alias ? "<small>" + escapeHtml(alias) + "</small>" : "");

    var v = document.createElement("span");
    var vt = String(item.valueTier || "").toUpperCase();
    v.className = "chip v-" + vt; v.textContent = vt || "?";

    row.appendChild(idx);
    row.appendChild(name);
    if (item.lastPatch){
      var lp = document.createElement("span");
      lp.className = "legacy-dot"; lp.title = "legacy / last seen " + txt(item.lastPatch);
      lp.textContent = "◆";
      row.appendChild(lp);
    }
    row.appendChild(v);

    row.dataset.search = ((txt(item.title) || txt(item.name)) + " " + txt(item.alias) + " " + txt(item.type)).toLowerCase();

    row.addEventListener("mouseenter", function(){ preview(item.slug, row); });
    row.addEventListener("click", function(){ preview(item.slug, row); });
    list.appendChild(row);
  });

  var searchBox = document.getElementById("search");
  searchBox.addEventListener("input", function(){
    var q = searchBox.value.trim().toLowerCase();
    var shown = 0;
    [].forEach.call(list.querySelectorAll(".row"), function(row){
      var match = !q || row.dataset.search.indexOf(q) !== -1;
      row.style.display = match ? "" : "none";
      if (match) shown++;
    });
    document.getElementById("count").textContent =
      q ? (shown + " / " + ITEMS.length + " items") : (ITEMS.length + " items");
  });

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }
</script>
</body>
</html>
