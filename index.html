<title>D2 Item of the Day</title>
<meta name="description" content="One rare Diablo 2 collector's item every day. Museum pieces, hidden value, and the stories behind them.">
<meta property="og:title" content="D2 Item of the Day">
<meta property="og:description" content="One rare Diablo 2 collector's item every day.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#120c0b">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<style>
/* Exocet, the classic Diablo display face (Emigre, 1992). Self-hosted.
   Used only for the item name, to keep the tooltip authentically D2. */
@font-face{
  font-family:"Exocet";
  src:url("fonts/exocet-heavy.woff") format("woff");
  font-weight:700;
  font-display:swap;
}
@font-face{
  font-family:"Exocet Light";
  src:url("fonts/exocet-light.woff") format("woff");
  font-weight:400;
  font-display:swap;
}

:root{
  /* modern dark shell, Spotify-like, with Diablo gold where Spotify is green */
  --bg:#0b0b0d;
  --bg-elev:#161619;
  --bg-elev-2:#1f1f25;
  --bg-stage:#000;            /* a few sprites bake in pure black, so the plate matches */
  --text:#ececf1;
  --text-dim:#a2a2ad;
  --text-faint:#6d6d78;
  --accent:#c7b377;
  --accent-bright:#e6cd83;
  --danger:#e0463f;
  --border:#26262d;
  --border-lit:#37373f;
  --radius:14px;
  --radius-sm:8px;

  /* spacing scale: every gap on the page is one of these */
  --sp-1:4px;
  --sp-2:8px;
  --sp-3:12px;
  --sp-4:16px;
  --sp-5:24px;
  --sp-6:32px;
  --sp-7:40px;

  /* one inventory cell. Every sprite is sized in cells, so a ring stays a
     ring next to an armor. This is the only knob for item scale. */
  --cell:48px;

  /* D2 item quality colors, exact */
  --q-unique:#c7b377;
  --q-set:#00ff00;
  --q-rare:#ffff64;
  --q-magic:#6969ff;
  --q-crafted:#ffa800;
  --q-rune:#ffa800;
  --q-normal:#ffffff;
  --q-prop:#6969ff;
  --q-meta:#808080;

  /* rarity ramp, cold to hot */
  --t-s:#e0463f;
  --t-a:#e8842c;
  --t-b:#d4b13c;
  --t-c:#57a55a;
  --t-d:#4a8fd0;
  --t-f:#6b6b74;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}

.wrap{max-width:680px;margin:0 auto;padding:0 var(--sp-4) 72px}

/* ---------- entrance animations ---------- */
@keyframes reveal{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes revealHero{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.reveal{animation:reveal .6s cubic-bezier(.2,.7,.2,1) both}
.item-head.reveal{animation-name:revealHero;animation-duration:.72s}
.r0{animation-delay:0s}
.r1{animation-delay:.09s}
.r2{animation-delay:.18s}
.r3{animation-delay:.3s}
.r4{animation-delay:.42s}
.r5{animation-delay:.54s}
@media (prefers-reduced-motion:reduce){
  .reveal{animation:none!important}
}

/* ---------- header: minimal, centered ---------- */
header{
  padding:var(--sp-4) 2px;text-align:center;
  border-bottom:1px solid var(--border);margin-bottom:var(--sp-5);
}
.brand{
  display:inline-block;
  font-size:.72rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--text-dim);
}
.brand-mark{color:#e03a33;font-weight:800}

/* item title under the header: the plain identity of the day's item */
.item-title{text-align:center;margin:0 0 var(--sp-5)}
.item-title h1{
  margin:0;font-size:1.5rem;font-weight:800;letter-spacing:.03em;
  line-height:1.15;text-transform:uppercase;color:var(--text);
}
.item-sub{
  margin-top:var(--sp-2);font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-faint);
}
.langbar{display:flex;flex-wrap:wrap;gap:var(--sp-2);justify-content:center;margin-top:var(--sp-4)}
.langbar:empty{display:none}
.langbtn{
  font-family:inherit;font-size:.72rem;
  background:var(--bg-elev);color:var(--text-dim);
  border:1px solid var(--border);border-radius:999px;
  padding:var(--sp-2) var(--sp-3);cursor:pointer;transition:color .18s,border-color .18s,background .18s;
}
.langbtn:hover{color:var(--accent);border-color:var(--border-lit)}
.langbtn.on{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:700}

/* ---------- flavor text: headingless italic lore, D3/D4 tooltip feel ---------- */
.flavor{
  font-style:italic;
  color:#cabf9f;
  font-size:1.06rem;
  line-height:1.72;
  margin:0 auto var(--sp-4);
  max-width:56ch;
  text-align:center;
}
/* the description group ends here, so step up to 32px before the find box */
.flavor:last-of-type{margin-bottom:var(--sp-6)}

/* ---------- banner ---------- */
/* ---------- hero: the item, alone on its row ---------- */
/* no outer card: the D2 tooltip sits directly on the page, like a screenshot */
.item-head{margin:0 0 var(--sp-6)}
.tip-col{display:flex;flex-direction:column;align-items:center;gap:var(--sp-4)}

/* the "in-game stage": dark vignette the item sits on, like a screenshot */
.sprite{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2)}
.sprite-stage{
  position:relative;display:flex;align-items:center;justify-content:center;
  box-sizing:content-box;                      /* the size below is the plate content */
  width:calc(var(--cell) * var(--cw, 2));      /* the plate is the item footprint */
  height:calc(var(--cell) * var(--ch, 3));
  padding:var(--sp-2);
  background:var(--bg-stage);
  border:1px solid var(--border);border-radius:var(--radius-sm);
}
.sprite-base{
  /* fills the footprint the stage sets, aspect kept */
  width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 2px 6px rgba(0,0,0,.55));transition:opacity .2s ease;
}
/* empty sockets shown over the item as recessed holes; hold gems when filled */
.sockets{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:var(--sp-1);pointer-events:none;
}
.socket-row{display:flex;justify-content:center;gap:var(--sp-1)}
.socket{
  width:calc(var(--cell) * .62);height:calc(var(--cell) * .62);border-radius:50%;opacity:.68;
  background:radial-gradient(circle at 50% 35%, rgba(20,20,26,.5) 0%, rgba(0,0,0,.85) 68%);
  box-shadow:
    inset 0 2px 3px rgba(0,0,0,.95),
    inset 0 -1px 2px rgba(190,190,210,.10),
    0 0 0 1px rgba(80,80,95,.6),
    0 1px 1px rgba(255,255,255,.07);
  display:flex;align-items:center;justify-content:center;
}
.socket-gem{width:calc(var(--cell) * .62);height:calc(var(--cell) * .62);display:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.85))}
/* filled: gem sits in the socket at full strength, the rim still reads around it */
.tip-col.show-fill .socket{
  opacity:1;
  background:radial-gradient(circle at 50% 40%, rgba(0,0,0,.12), rgba(0,0,0,.5));
  box-shadow:inset 0 0 3px rgba(0,0,0,.9), 0 0 0 1px rgba(80,80,95,.55);
}
.tip-col.show-fill .socket-gem{display:block}
.sprite-toggle{
  font-family:inherit;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-dim);background:var(--bg-elev-2);border:1px solid var(--border);
  border-radius:999px;padding:var(--sp-2) var(--sp-3);cursor:pointer;
}
.sprite-toggle:hover{color:var(--text);border-color:var(--accent)}
/* stats the socketables add, revealed only when filled */
.tooltip .t-fill{display:none}
.tip-col.show-fill .tooltip .t-fill{display:block}
/* runeword name swap: gold runeword name on top, base name greys out beneath */
.tooltip .t-name-fill{display:none}
.tip-col.show-fill .tooltip .t-name-fill{display:block;color:var(--q-unique)}
.tip-col.show-fill .tooltip .t-name:not(.t-name-fill){color:#8a8a93;font-weight:400;font-size:.86em}

/* the D2 tooltip, kept sharp and pixel-accurate */
.tooltip{
  background:rgba(2,2,4,.92);
  border:1px solid #2c2c33;
  border-radius:2px;
  padding:16px 20px;
  text-align:center;
  font-family:"Exocet Light",Georgia,serif;  /* body in the lighter D2 weight */
  font-size:1.02rem;
  letter-spacing:.03em;
  line-height:1.45;
  text-transform:uppercase;                         /* D2 tooltips read as all caps */
  white-space:nowrap;                               /* a D2 row never wraps */
  width:max-content;                                /* size to the longest line */
  box-shadow:0 0 0 1px rgba(0,0,0,.5), 0 8px 26px rgba(0,0,0,.55);
}
.tooltip .t-name{
  font-family:"Exocet",Georgia,serif;
  font-weight:700;font-size:1.06rem;letter-spacing:.03em;line-height:1.3;
  margin-bottom:1px;
}
.tooltip{--qc:var(--q-normal)}
.tooltip .t-type{color:var(--qc);opacity:.95}
.tooltip .t-lines{margin-top:var(--sp-2)}
.tooltip .t-line{color:var(--q-prop)}           /* default: magic-property blue */
.tooltip .t-line.t-white{color:#dedee4}          /* base stats, runes, required level */
.tooltip .t-line.t-grey{color:#8a8a93}
.tooltip .t-line.t-red{color:#e0463f}            /* unmet requirement */
.tooltip .t-line.t-gold{color:var(--q-rune)}

/* trader nickname caption, deliberately outside and unlike the tooltip */
.aka{
  font-size:.74rem;font-style:italic;color:var(--text-faint);
  text-align:center;
}

/* name and base type both take the item's quality color, like in-game */
.q-unique{--qc:var(--q-unique)}
.q-set{--qc:var(--q-set)}
.q-rare{--qc:var(--q-rare)}
.q-magic{--qc:var(--q-magic)}
.q-crafted{--qc:var(--q-crafted)}
.q-rune{--qc:var(--q-rune)}
.q-normal{--qc:var(--q-normal)}
.q-runeword{--qc:var(--q-unique)}                 /* runeword name is gold... */
.q-runeword .t-type{color:#8a8a93}                /* ...but its base type is grey */
.tooltip .t-name{color:var(--qc)}
.q-unique .t-name{text-shadow:0 0 10px rgba(199,179,119,.35)}
.q-set .t-name{text-shadow:0 0 10px rgba(0,255,0,.28)}
.q-rare .t-name{text-shadow:0 0 10px rgba(255,255,100,.28)}
.q-magic .t-name{text-shadow:0 0 10px rgba(105,105,255,.38)}
.q-crafted .t-name{text-shadow:0 0 10px rgba(255,168,0,.3)}
.q-rune .t-name{text-shadow:0 0 10px rgba(255,168,0,.3)}
.q-normal .t-name{text-shadow:0 0 9px rgba(255,255,255,.16)}

/* ---------- tier tags: understated supporting metadata ---------- */
.tags{display:flex;flex-wrap:wrap;gap:var(--sp-2);justify-content:center}
.tag{
  display:inline-flex;align-items:baseline;gap:var(--sp-2);
  font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text-faint);
  background:var(--bg-elev-2);border:1px solid var(--border);border-radius:999px;
  padding:var(--sp-2) var(--sp-3);cursor:default;
}
.tag b{font-weight:800;font-size:.8rem;letter-spacing:.01em;text-transform:none;color:var(--text)}
/* rarity carries the only ramp on the row, so it stays the tag you read first */
.rar-common b{color:var(--t-f)}
.rar-uncommon b{color:var(--t-c)}
.rar-rare b{color:var(--t-b)}
.rar-very-rare b{color:var(--t-a)}
.rar-mythic b{color:var(--t-s)}
.tag.rar-mythic{border-color:rgba(224,70,63,.32)}
.tag.legacy{border-color:rgba(199,179,119,.35)}
.tag.legacy b{color:var(--accent)}
.tag.era b{color:var(--text)}                     /* default era: neutral */
.tag.era-classic{border-color:rgba(230,200,79,.4)}
.tag.era-classic b{color:#e6c84f}                 /* classic: rare-yellow, the golden age of rares */
/* contraband: items that cannot legitimately exist */
.tag.illicit{border-color:rgba(214,69,69,.45);background:rgba(120,30,30,.14);align-items:center}
.tag.illicit b{color:#ff6b6b;letter-spacing:.09em;text-transform:uppercase;font-size:.72rem}
.tag.illicit-bugged{border-color:rgba(230,165,79,.45);background:rgba(120,80,20,.12)}
.tag.illicit-bugged b{color:#e6a54f}              /* game-bug, not an external hack */

/* per-item labels: whatever this one item is worth calling out */
.tag.label b{color:var(--text-dim)}
.tag.label-source b{color:#8fb8d8}                /* where it comes from */
.tag.label-added b{color:var(--accent)}           /* quieter sibling of Last seen */
.tag.label-roll b{color:#79c07d}                  /* a maxed roll, read as a full bar */
/* ethereal: washed out, the way the item looks in game */
.tag.label-eth{border-color:rgba(180,190,210,.3);background:rgba(150,165,190,.08);align-items:center}
.tag.label-eth b{color:#b6c2d4;letter-spacing:.09em;text-transform:uppercase;font-size:.72rem}

/* ---------- prose ---------- */
section{margin:0 0 var(--sp-5)}
h2{
  font-size:.7rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--text-faint);margin:0 0 var(--sp-2);
}
section p{margin:0 0 var(--sp-3);font-size:1.02rem;color:#dcdce2}
section p:last-child{margin-bottom:0}

.find{
  background:linear-gradient(180deg,var(--bg-elev),var(--bg));
  border:1px solid var(--border);border-left:3px solid var(--accent);
  border-radius:var(--radius-sm);padding:var(--sp-4);
}
.find p{margin:0;font-size:1.02rem}
/* proof: click to see the real in-game screenshot behind the card */
.proof-link{
  display:block;width:fit-content;margin:0 auto;
  font-family:inherit;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-dim);background:var(--bg-elev-2);border:1px solid var(--border);
  border-radius:999px;padding:var(--sp-2) var(--sp-3);cursor:pointer;
}
.proof-link:hover{color:var(--text);border-color:var(--accent)}
.proof-modal{
  position:fixed;inset:0;z-index:100;display:none;
  align-items:center;justify-content:center;padding:var(--sp-5);
  background:rgba(0,0,0,.88);cursor:zoom-out;
}
.proof-modal.open{display:flex}
.proof-modal img{
  width:auto;height:auto;max-width:92vw;max-height:88vh;
  min-width:min(90vw,440px);
  border:1px solid var(--border);border-radius:8px;image-rendering:auto;
  box-shadow:0 10px 40px rgba(0,0,0,.6);
}
.uncertain{font-size:.82rem;color:var(--text-faint);font-style:italic;margin-top:var(--sp-3)}

/* ---------- archive: Spotify-style list ---------- */
details{border-top:1px solid var(--border);margin-top:var(--sp-2)}
summary{
  cursor:pointer;padding:var(--sp-4) 2px;list-style:none;
  font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--text-dim);display:flex;align-items:center;gap:var(--sp-2);
}
summary::-webkit-details-marker{display:none}
summary::after{content:"▾";color:var(--text-faint);font-size:.8rem}
details[open] summary::after{content:"▴"}
summary:hover{color:var(--accent)}
.archive-list{list-style:none;margin:0;padding:0 0 var(--sp-2)}
.archive-list li{border-radius:var(--radius-sm)}
.archive-list a{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:var(--sp-2) var(--sp-3);text-decoration:none;color:var(--text);font-size:.9rem;border-radius:8px;
}
.archive-list a:hover{background:var(--bg-elev)}
.archive-list .pip{
  font-weight:800;font-size:.82rem;width:20px;text-align:center;flex:none;
}
.pip-s{color:var(--t-s)} .pip-a{color:var(--t-a)} .pip-b{color:var(--t-b)}
.pip-c{color:var(--t-c)} .pip-d{color:var(--t-d)} .pip-f{color:var(--t-f)}
.archive-list .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

footer{
  margin-top:var(--sp-7);padding-top:var(--sp-5);border-top:1px solid var(--border);
  color:var(--text-faint);font-size:.74rem;
}
footer p{margin:0 0 var(--sp-2)}
.foot-timer{
  color:var(--text-dim);letter-spacing:.1em;text-transform:uppercase;
  font-size:.72rem;margin:0 0 var(--sp-3);
}

@media (min-width:640px){
  .wrap{padding:0 var(--sp-5) 88px}
  :root{--cell:64px}
  .sprite-stage{padding:var(--sp-3)}
}

/* ---------- skeleton: static placeholder painted before app.js runs ----------
   render() overwrites #app's innerHTML wholesale, so this just vanishes the
   moment the real item lands. No JS needed to remove it. */
.skeleton{display:flex;flex-direction:column;align-items:center;gap:var(--sp-4);margin-bottom:var(--sp-6)}
.skel-bar,.skel-tip,.skel-stage,.skel-tag{
  background:var(--bg-elev-2);border-radius:var(--radius-sm);
  animation:skelPulse 1.4s ease-in-out infinite;
}
.skel-title-row{display:flex;flex-direction:column;align-items:center;gap:var(--sp-2);margin-bottom:var(--sp-2)}
.skel-bar.skel-h1{width:200px;height:22px;border-radius:4px}
.skel-bar.skel-sub{width:110px;height:11px;border-radius:4px}
.skel-tip{width:240px;height:92px;border-radius:2px}
.skel-stage{width:calc(var(--cell) * 2);height:calc(var(--cell) * 3)}
.skel-tags{display:flex;gap:var(--sp-2)}
.skel-tag{width:76px;height:23px;border-radius:999px}
@keyframes skelPulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){
  .skel-bar,.skel-tip,.skel-stage,.skel-tag{animation:none;opacity:.75}
}
</style>
</head>
<body>
<div class="wrap">

<header class="reveal r0">
  <div class="brand"><span class="brand-mark">Diablo&nbsp;2</span>&nbsp;Item of the Day</div>
  <div class="langbar" id="langbar"></div>
</header>

<main id="app"><div class="skeleton" aria-hidden="true">
  <div class="skel-title-row">
    <div class="skel-bar skel-h1"></div>
    <div class="skel-bar skel-sub"></div>
  </div>
  <div class="skel-tip"></div>
  <div class="skel-stage"></div>
  <div class="skel-tags">
    <div class="skel-tag"></div>
    <div class="skel-tag"></div>
  </div>
</div></main>

<div class="proof-modal" id="proofModal">
  <img id="proofImg" src="" alt="in-game screenshot of the item">
</div>

<footer>
  <p class="foot-timer" id="rollover"></p>
  <p id="footerDisclaimer">Rarity is a rough guess against a mature ladder season. It means how often you see one around, not just drop rate.</p>
  <p id="footerLegal">Not affiliated with Blizzard Entertainment.</p>
</footer>

</div>

<!-- Bump ?v= whenever items.js or app.js changes. GitHub Pages caches the
     scripts for 4 hours but this page for 10 minutes, so without a version key
     a returning visitor runs new markup against the old JS. -->
<script src="items.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
